name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    # Linux is what honeyrepo 0.1.0 has been verified on. macOS and Windows are run
    # so that their results are visible, but they do not fail the build yet.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: honeyrepo --version
      - run: honeyrepo list

  package:
    name: build the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel into a clean environment and run it
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-test/bin/honeyrepo --version
          # No sandbox, so the only correct result is LEAKED (exit code 1). HELD or anything else is a failure.
          code=0
          /tmp/wheel-test/bin/honeyrepo run readme-exfil || code=$?
          test "$code" -eq 1
