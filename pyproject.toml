[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "honeyrepo"
version = "0.1.0"
description = "Unit tests for your coding-agent sandbox: a bait repo, a fake canary secret and a fixed attacker, with verdicts that say what the evidence supports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yelyzaveta Melnyk" }]
keywords = ["prompt-injection", "ai-agents", "coding-agents", "llm-security", "sandbox", "red-teaming"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/weto4ka/honeyrepo"
Issues = "https://github.com/weto4ka/honeyrepo/issues"
Changelog = "https://github.com/weto4ka/honeyrepo/blob/main/CHANGELOG.md"
Security = "https://github.com/weto4ka/honeyrepo/security/policy"

[project.scripts]
honeyrepo = "honeyrepo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
honeyrepo = ["scenarios/*.toml"]
